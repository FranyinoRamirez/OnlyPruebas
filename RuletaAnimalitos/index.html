<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruleta de Animalitos - Venezuela</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated Background -->
    <div id="particles-bg"></div>

    <!-- Header -->
    <header class="header">
      <!-- Logo omitted as per request -->
      <div class="header-title">
        <h1>RULETA ANIMALITOS</h1>
        <p>PAGO VENEZUELA</p>
        <div class="ve-flag-stripe"></div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
      <!-- Left Column: Roulette -->
      <section class="roulette-section">
        <div
          class="glass-card"
          style="
            padding: 30px;
            border-radius: 50%;
            background: radial-gradient(
              circle,
              rgba(20, 20, 50, 0.8),
              rgba(10, 10, 25, 0.9)
            );
          "
        >
          <div class="wheel-container">
            <div class="wheel-outer-ring"></div>
            <canvas id="roulette-wheel" width="420" height="420"></canvas>
            <div class="wheel-pointer">🔻</div>
            <div class="wheel-center" id="spin-btn-center">
              <span>GIRAR</span>
            </div>
          </div>
        </div>

        <div class="spin-btn-container">
          <button id="spin-btn" class="btn-spin">GIRAR RULETA</button>
        </div>

        <!-- Confetti Container -->
        <div id="confetti-wrapper" class="confetti-container"></div>
      </section>

      <!-- Right Column: Sidebar -->
      <aside class="sidebar">
        <!-- Manage Animals Panel -->
        <div class="glass-card">
          <div class="card-header">
            <span class="icon">🐾</span>
            <h2>Animalitos</h2>
          </div>
          <div class="card-body">
            <form id="add-animal-form" class="add-animal-form">
              <input
                type="text"
                id="new-animal-name"
                placeholder="Nombre (ej. Lapa)"
                required
                maxlength="12"
              />
              <input
                type="text"
                id="new-animal-emoji"
                placeholder="Emoji (ej. 🐹)"
                required
                maxlength="2"
                style="flex: 0 0 60px; text-align: center"
              />
              <button type="submit" class="btn-add">Agregar</button>
            </form>

            <div id="animals-list" class="animals-list">
              <!-- Animals will be injected here by JS -->
            </div>
          </div>
        </div>

        <!-- History Panel -->
        <div class="glass-card">
          <div class="card-header">
            <span class="icon">📜</span>
            <h2>Historial</h2>
          </div>
          <div class="card-body">
            <div id="history-list" class="history-list">
              <!-- History items will appear here -->
              <div class="history-empty">Aún no hay resultados</div>
            </div>
            <button id="clear-history-btn" class="btn-clear-history">
              Borrar Historial
            </button>
          </div>
        </div>

        <!-- Theme Selector -->
        <div class="glass-card theme-selector-card">
          <div class="card-header">
            <span class="icon">🎨</span>
            <h2>Tema de Fondo</h2>
          </div>
          <div class="card-body">
            <select id="theme-select" class="theme-dropdown">
              <option value="">📅 Auto (Según fecha)</option>
              <option value="default">🇻🇪 Clásico (Venezuela)</option>
              <option value="theme-carnival">🎭 Carnaval</option>
              <option value="theme-mexico">🇲🇽 México</option>
              <option value="theme-love">💖 San Valentín</option>
              <option value="theme-halloween">🎃 Halloween</option>
              <option value="theme-christmas">🎄 Navidad</option>
              <option value="theme-newyear">🎆 Año Nuevo</option>
            </select>
          </div>
        </div>

        <!-- Pago Venezuela Section -->
        <div class="glass-card pago-section">
          <div class="card-header">
            <span class="icon">🇻🇪</span>
            <h2>Pago Venezuela</h2>
          </div>
          <div class="card-body">


            <div class="pago-balance">
              <div class="label">Bote Acumulado</div>
              <div class="amount">1,500.00</div>
              <div class="currency">Bolívares Digitales (Bs.D)</div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2026 Ruleta Animalitos Venezuela. Juega responsablemente.</p>
    </footer>

    <!-- Winner Modal -->
    <div id="winner-overlay" class="winner-overlay">
      <div class="winner-modal">
        <div class="winner-content">
          <div class="winner-label">¡GANADOR!</div>
          <div id="winner-name" class="winner-name">TIGRE</div>
          <div id="winner-emoji" class="winner-emoji">🐯</div>
          <div id="winner-number" class="winner-number">Animalito #10</div>
          <button id="close-modal-btn" class="btn-close-modal">
            Siguiente Tiro
          </button>
        </div>
      </div>
    </div>

    <!-- Sound Control -->
    <div id="sound-toggle" class="sound-indicator">
      <div class="sound-bars">
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
      </div>
      <span class="sound-label">Sonido</span>
    </div>

    <script src="script.js"></script>
    <script>
        // 1. Deshabilitar click derecho
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Deshabilitar Atajos de Teclado
        document.onkeydown = function(e) {
            if (
                e.keyCode == 123 || // F12
                (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
                (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) || // Ctrl+Shift+C
                (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) || // Ctrl+Shift+J
                (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
                (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S (Guardar)
            ) {
                return false;
            }
        };

        // 3. Limpieza de Consola (Por si logran abrirla)
        setInterval(() => {
            console.clear();
        }, 1000);
    </script>
  </body>
</html>
